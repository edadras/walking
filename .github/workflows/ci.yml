name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: walking_test
          MYSQL_USER: walking
          MYSQL_PASSWORD: walking
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: walking
      DB_PASSWORD: walking
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, intl, bcmath, pcntl, zip
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: Grant the test user access for parallel-safe DB creation
        run: mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL ON *.* TO 'walking'@'%'; FLUSH PRIVILEGES;"
      - name: Tests
        run: php artisan test

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build (debug APK)
        run: flutter build apk --debug --flavor bazaar
      - name: Android unit tests (widgets, lock-screen notification, icon)
        working-directory: mobile/android
        run: ./gradlew :app:testBazaarDebugUnitTest

  e2e:
    name: E2E (Android emulator + real backend)
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: walking_e2e
          MYSQL_USER: walking
          MYSQL_PASSWORD: walking
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: walking_e2e
      DB_USERNAME: walking
      DB_PASSWORD: walking
      REDIS_HOST: 127.0.0.1
      QUEUE_CONNECTION: sync
      SMS_DRIVER: log
      LOADTEST_OTP_CODE: '12345'
      ADMIN_MFA_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, intl, bcmath, pcntl, zip, gd
          coverage: none
      - name: Backend up
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env && php artisan key:generate
          echo "PII_HASH_KEY=$(openssl rand -base64 32)" >> .env
          php artisan migrate --force
          php artisan db:seed --class=PlatformSeeder --force
          php artisan db:seed --class=DemoSeeder --force
          php artisan e2e:prepare 09990000001
          PHP_CLI_SERVER_WORKERS=4 nohup php artisan serve --no-reload --host=0.0.0.0 --port=8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/time && break; sleep 1; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Pub get
        working-directory: mobile
        run: flutter pub get && flutter gen-l10n
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: mobile
          # 10.0.2.2 is the runner (host) as seen from the emulator.
          script: flutter test integration_test/app_flow_test.dart --flavor play --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1 --dart-define=E2E_OTP=12345
      - name: Backend log on failure
        if: failure()
        run: tail -n 200 /tmp/serve.log; tail -n 200 backend/storage/logs/laravel.log || true
